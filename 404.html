    <!--
      Theme bootstrap — runs before the first paint so the right theme shows at once (no flash).
      Appearance: ?theme=jour|nuit|auto (QA / presenter link: removed from the URL at once, kept in sessionStorage
      "autolux-next:theme-param" until src/lib/theme.ts has persisted it as the setting)
      → else the profile store (localStorage "autolux-next:profile" → state.settings.appearance) → else « jour ».
      'auto' follows prefers-color-scheme. KEEP IN SYNC with THEME_CHROME in src/lib/theme.ts.
    -->
    <script>
      (function () {
        var d = document.documentElement, a = 'jour', t, c
        var ok = function (v) { return v === 'jour' || v === 'nuit' || v === 'auto' }
        try {
          var k = 'autolux-next:theme-param', q = new URLSearchParams(location.search), p = q.get('theme')
          if (p !== null) {
            q.delete('theme')
            var s = q.toString()
            history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash)
            // Survives a reload that happens before the app could persist it (cold dev server, chunk retry).
            if (ok(p)) try { sessionStorage.setItem(k, p) } catch (e) {}
          } else {
            try { p = sessionStorage.getItem(k) } catch (e) {}
          }
          if (ok(p)) { a = p; d.setAttribute('data-theme-param', p) }
          else {
            var j = JSON.parse(localStorage.getItem('autolux-next:profile') || 'null')
            var v = j && j.state && j.state.settings && j.state.settings.appearance
            if (ok(v)) a = v
          }
        } catch (e) {}
        try { t = a === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'nuit' : 'jour') : a } catch (e) { t = 'jour' }
        d.setAttribute('data-theme', t)
        d.setAttribute('data-appearance', a)
        c = t === 'nuit' ? ['#0B0A0A', 'dark', 'black-translucent'] : ['#F5F5F7', 'light', 'default']
        var m = function (n, v) { var e = document.querySelector('meta[name="' + n + '"]'); if (e) e.setAttribute('content', v) }
        m('theme-color', c[0])
        m('color-scheme', c[1])
        m('apple-mobile-web-app-status-bar-style', c[2])
      })()
    </script>
